name: Pipeline tests and secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run fictional pipeline tests
        run: python3 -m unittest discover -s pipeline-agent/tests -q
      - name: Build the fictional three-cycle demo
        working-directory: pipeline-agent
        run: python3 community_demo.py
      - name: Install pinned secret scanner
        env:
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and Git history
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner
